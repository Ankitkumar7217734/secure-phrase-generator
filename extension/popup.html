<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Phrase Generator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <span>PassGen</span>
      </div>
      <nav class="tabs" aria-label="Views">
        <button id="tabGenerate" class="tab active" type="button">Generator</button>
        <button id="tabHistory" class="tab" type="button">
          History
          <span id="historyBadge" class="badge" hidden></span>
        </button>
      </nav>
    </header>

    <!-- ===================== GENERATOR VIEW ===================== -->
    <main id="viewGenerate" class="view">
      <section class="pw-card">
        <div class="pw-box">
          <p id="pwText" class="pw-text pw-hidden">Loading…</p>
          <button id="pwOverlay" class="pw-overlay" type="button" title="Reveal password">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M9.88 9.88a3 3 0 1 0 4.24 4.24"
              />
              <path
                d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
              />
              <path
                d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
              />
              <line x1="2" x2="22" y1="2" y2="22" />
            </svg>
            <span>Tap to reveal</span>
          </button>
        </div>
        <div class="meter-track">
          <div id="meterBar" class="meter-bar"></div>
        </div>
        <div class="meter-row">
          <span id="strengthText" class="strength-label">Strong</span>
          <span id="entropyText" class="entropy-label"></span>
        </div>
      </section>

      <section class="controls">
        <div id="modeSeg" class="seg" role="radiogroup" aria-label="Password length">
          <button class="seg-btn" type="button" data-mode="short">Short</button>
          <button class="seg-btn active" type="button" data-mode="medium">Medium</button>
          <button class="seg-btn" type="button" data-mode="long">Long</button>
        </div>

        <label class="check">
          <input type="checkbox" id="optUsername" data-setting="withUsername" />
          <span class="check-body">
            <span class="check-title">Also generate a username</span>
            <span class="check-sub">A readable handle for sign-up forms</span>
          </span>
        </label>

        <div id="usernameRow" class="username-row">
          <span class="row-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <span id="usernameValue" class="u-value">—</span>
          <button id="btnNewUsername" class="icon-btn" type="button" title="New username">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
            </svg>
          </button>
        </div>

        <label class="check">
          <input type="checkbox" id="optAutoHide" data-setting="autoHide" />
          <span class="check-body">
            <span class="check-title">Auto-hide password</span>
            <span class="check-sub">Blur the password until you tap to reveal</span>
          </span>
        </label>

        <label class="check">
          <input type="checkbox" id="optExcludeSimilar" data-setting="excludeSimilar" />
          <span class="check-body">
            <span class="check-title">Exclude similar characters</span>
            <span class="check-sub">Skip 0/O and 1/l in inserted characters</span>
          </span>
        </label>
      </section>

      <section class="actions">
        <div id="detectedChip" class="detected-chip" hidden>
          <span class="row-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
              <path d="M2 12h20" />
            </svg>
          </span>
          <span class="detected-text">
            Will save for <strong id="detectedSite"></strong>
          </span>
          <button
            id="btnDismissDetected"
            class="icon-btn"
            type="button"
            title="Don't attach this site"
            aria-label="Don't attach this site"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <button id="btnCopyPassword" class="btn primary" type="button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
          </svg>
          Copy password
        </button>
        <div class="actions-row">
          <button id="btnGenerate" class="btn ghost" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            New password
          </button>
          <button id="btnCopyUsername" class="btn ghost" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
            Copy username
          </button>
        </div>
      </section>
    </main>

    <!-- ===================== HISTORY VIEW ===================== -->
    <main id="viewHistory" class="view" hidden>
      <div class="history-head">
        <span class="history-title"
          >Saved passwords <span id="historyCount" class="count"></span
        ></span>
        <button id="btnClearHistory" class="link-danger" type="button" hidden>
          Clear all
        </button>
      </div>

      <div id="historyList" class="history-list"></div>

      <div id="historyEmpty" class="history-empty" hidden>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="34"
          height="34"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <p><strong>Nothing saved yet</strong></p>
        <p class="sub">
          Copy a password and it appears here automatically — then add the site
          name, website link and username yourself so you remember where it
          belongs.
        </p>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="words.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
